[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localrag"
version = "0.1.0"
description = "A local document chat website"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
localrag-ingest = "localrag.cli:main"
localrag = "localrag.web:main"

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9"]
rag = ["chromadb>=0.5"]
documents = ["pypdf>=5.0", "python-docx>=1.1"]
desktop = ["pyinstaller>=6.0"]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localrag = ["web/*"]
